# VI feedback mixer taps on WSA bus 1 (WSA2 macro). Only applicable on
# boards that drive two WSA buses (e.g. Glymur CRD, Yoga Slim 7x);
# single-bus boards (e.g. T14s Gen 7) should not include this file.
EnableSequence [
	cset "name='WSA2 WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
	cset "name='WSA2 WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
]
