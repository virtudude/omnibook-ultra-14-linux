# Enable V/I sense feedback on four-speaker WSA884x for Speaker
# Protection. Pre-SP boards must leave this include out of their
# HiFi.conf -- flipping VISENSE Switch with no kernel-side SP module
# listening is harmless, but routing V/I samples with no consumer
# wastes bus bandwidth.
EnableSequence [
	cset "name='WooferLeft VISENSE Switch' 1"
	cset "name='TweeterLeft VISENSE Switch' 1"
	cset "name='WooferRight VISENSE Switch' 1"
	cset "name='TweeterRight VISENSE Switch' 1"
]
