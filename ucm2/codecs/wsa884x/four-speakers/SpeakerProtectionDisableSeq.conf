# Teardown counterpart to SpeakerProtectionEnableSeq.conf. Pair with
# the enable include in the same SectionDevice to keep VISENSE off
# when the speakers are not in use.
DisableSequence [
	cset "name='WooferLeft VISENSE Switch' 0"
	cset "name='TweeterLeft VISENSE Switch' 0"
	cset "name='WooferRight VISENSE Switch' 0"
	cset "name='TweeterRight VISENSE Switch' 0"
]
