# Stereo endpoint: the DSP graph splits it onto the four speakers.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsae.File "/Qualcomm/glymur/hp-8f03/SpeakerSeq.conf"
	Include.wsasp.File "/codecs/wsa884x/four-speakers/SpeakerProtectionEnableSeq.conf"
	Include.wsm1vi.File "/codecs/qcom-lpass/wsa-macro/Wsa1VISenseEnableSeq.conf"
	Include.wsm2vi.File "/codecs/qcom-lpass/wsa-macro/Wsa2VISenseEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsaspk.File "/Qualcomm/glymur/hp-8f03/SpeakerSeq.conf"
	Include.wsaspe.File "/codecs/wsa884x/four-speakers/SpeakerProtectionEnableSeq.conf"
	Include.wsm1vie.File "/codecs/qcom-lpass/wsa-macro/Wsa1VISenseEnableSeq.conf"
	Include.wsm2vie.File "/codecs/qcom-lpass/wsa-macro/Wsa2VISenseEnableSeq.conf"
	Include.wsaspd.File "/codecs/wsa884x/four-speakers/SpeakerProtectionDisableSeq.conf"
	Include.wsm1vid.File "/codecs/qcom-lpass/wsa-macro/Wsa1VISenseDisableSeq.conf"
	Include.wsm2vid.File "/codecs/qcom-lpass/wsa-macro/Wsa2VISenseDisableSeq.conf"

	Value {
		PlaybackChannels 2
		# The kernel mirrors this volume into MSPP's loudness processing
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
		PlaybackSwitch "Speaker Playback Switch"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Mic LED"
		CaptureSwitch "Mic LED Capture Switch"
	}
}
