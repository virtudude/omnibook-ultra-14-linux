Syntax 6

# HP OmniBook Ultra 14-kg0xxx (8F03): hw:N,0 speakers, hw:N,1 mics.
#
# The speaker kernel (DT speaker operating point) with the HP speaker topology
# (DSP "Speaker Playback Volume") gets the speaker protection setup. Any other
# kernel gets the stock GLYMUR-CRD setup, with V/I sense left off.

Include.led.File "/common/ctl/led.conf"
Macro [
	{ CtlNew { Arg="name='Speaker Playback Switch' type=bool,count=1 on" } }
	{ SetLED { LED="speaker" Action="attach" CtlId="Speaker Playback Switch" } }
	{ CtlNew { Arg="name='Mic LED Capture Switch' type=bool,count=1 off" } }
	{ SetLED { LED="mic" Action="attach" CtlId="Mic LED Capture Switch" } }
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

If.op {
	Condition {
		Type ControlExists
		Control "name='Speaker Operating Point Switch'"
	}
	True {
		# The kernel has set the routing, compander and gains and made them
		# read-only: a write to them fails and aborts its sequence, so the
		# shared wsa884x/wsa-macro init files are not included here.
		If.dsp {
			Condition {
				Type ControlExists
				Control "name='Speaker Playback Volume'"
			}
			True {
				SectionUseCase."HiFi" {
					File "/Qualcomm/glymur/hp-8f03/HiFi.conf"
					Comment "HiFi quality Music."
				}
			}
		}
	}
	False {
		SectionUseCase."HiFi" {
			File "/Qualcomm/glymur/HiFi.conf"
			Comment "HiFi quality Music."
		}

		Include.wsa-init.File "/codecs/wsa884x/four-speakers/init.conf"
		Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/four-speakers/init.conf"
	}
}
