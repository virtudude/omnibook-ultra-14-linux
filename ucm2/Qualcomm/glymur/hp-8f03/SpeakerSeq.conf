# The kernel holds each amplifier's PA Volume, WSA MODE and COMP Switch; only
# the controls it leaves writable. PBR stays off, as on Windows.
EnableSequence [
	cset "name='WooferLeft BOOST Switch' 1"
	cset "name='WooferLeft DAC Switch' 1"
	cset "name='WooferLeft PBR Switch' 0"
	cset "name='TweeterLeft BOOST Switch' 1"
	cset "name='TweeterLeft DAC Switch' 1"
	cset "name='TweeterLeft PBR Switch' 0"
	cset "name='WooferRight BOOST Switch' 1"
	cset "name='WooferRight DAC Switch' 1"
	cset "name='WooferRight PBR Switch' 0"
	cset "name='TweeterRight BOOST Switch' 1"
	cset "name='TweeterRight DAC Switch' 1"
	cset "name='TweeterRight PBR Switch' 0"
]

DisableSequence [
	cset "name='WooferLeft BOOST Switch' 0"
	cset "name='WooferLeft DAC Switch' 0"
	cset "name='TweeterLeft BOOST Switch' 0"
	cset "name='TweeterLeft DAC Switch' 0"
	cset "name='WooferRight BOOST Switch' 0"
	cset "name='WooferRight DAC Switch' 0"
	cset "name='TweeterRight BOOST Switch' 0"
	cset "name='TweeterRight DAC Switch' 0"
]
